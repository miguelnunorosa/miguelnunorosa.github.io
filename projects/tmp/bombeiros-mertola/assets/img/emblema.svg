<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Emblema provisório dos Bombeiros Voluntários de Mértola">
  <!-- Emblema provisório: substituir pelo logótipo oficial da corporação -->
  <defs>
    <!-- arco superior (esquerda→direita por cima) -->
    <path id="arco-topo" d="M 22,100 A 78,78 0 0 1 178,100" fill="none"/>
    <!-- arco inferior (esquerda→direita por baixo, texto legível) -->
    <path id="arco-base" d="M 22,100 A 78,78 0 0 0 178,100" fill="none"/>
  </defs>

  <!-- fundo -->
  <circle cx="100" cy="100" r="100" fill="#f6f1e4"/>
  <circle cx="100" cy="100" r="92" fill="#b32226"/>
  <circle cx="100" cy="100" r="88" fill="#1c1913"/>

  <!-- texto circular -->
  <text font-family="Satoshi, Arial, sans-serif" font-size="13" font-weight="700" fill="#f6f1e4" letter-spacing="2.4">
    <textPath href="#arco-topo" text-anchor="middle" startOffset="50%">BOMBEIROS VOLUNTÁRIOS</textPath>
  </text>
  <text font-family="Satoshi, Arial, sans-serif" font-size="13" font-weight="700" fill="#f6f1e4" letter-spacing="3">
    <textPath href="#arco-base" text-anchor="middle" startOffset="50%">MÉRTOLA · 1971</textPath>
  </text>

  <!-- separadores laterais -->
  <circle cx="22" cy="100" r="2.6" fill="#c99a2e"/>
  <circle cx="178" cy="100" r="2.6" fill="#c99a2e"/>

  <!-- capacete de bombeiro -->
  <g transform="translate(100,80)">
    <path d="M -34,6 q0,-26 34,-26 q34,0 34,26 l4,10 -76,0 z" fill="#f6f1e4"/>
    <path d="M -38,16 h76 a4,4 0 0 1 -4,6 h-68 a4,4 0 0 1 -4,-6 z" fill="#c99a2e"/>
    <rect x="-30" y="-14" width="60" height="6" rx="3" fill="#b32226"/>
  </g>

  <!-- machados cruzados -->
  <g stroke="#f6f1e4" stroke-width="7" stroke-linecap="round">
    <line x1="52" y1="120" x2="86" y2="158"/>
    <line x1="148" y1="120" x2="114" y2="158"/>
  </g>
  <g fill="#c99a2e">
    <path d="M 44,112 l20,-8 -6,16 -8,6 -6,-8 z"/>
    <path d="M 156,112 l-20,-8 6,16 8,6 6,-8 z"/>
  </g>
</svg>
